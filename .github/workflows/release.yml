name: Publish owner-approved SDK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      documentation_only: ${{ steps.version.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install "packaging>=25,<27"
      - name: Validate owner decisions and exact tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python tools/release_gate.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - id: version
        run: |
          python -c "import json; from tools.release_gate import version; v=version(); c=json.load(open('release-config.json')); print('prerelease=' + str(v.is_prerelease).lower()); print('documentation_only=' + str(c.get('documentation_only',{}).get('version') == str(v)).lower())" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    if: needs.prepare.outputs.documentation_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]" "build>=1.3,<2" "twine>=6,<7"
      - name: Current signed credit operations
        run: python -m pytest tests/test_credit_commerce.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_artifacts.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  verify_documentation:
    needs: prepare
    if: needs.prepare.outputs.documentation_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install "build>=1.3,<2" "twine>=6,<7" "packaging>=25,<27"
      - run: python tools/verify_docs_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_docs_release.py --artifacts
      - name: Check installed wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python tests/installed_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  testpypi:
    needs: [prepare, verify, verify_documentation]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.verify.result == 'success' || needs.verify_documentation.result == 'success') && needs.prepare.outputs.prerelease == 'true' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
  pypi:
    needs: [prepare, verify, verify_documentation]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.verify.result == 'success' || needs.verify_documentation.result == 'success') && needs.prepare.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
