[build-system]
requires = ["setuptools>=78,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "kdpika-licensing"
dynamic = ["version"]
description = "KDPika Licensing Python SDK"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KDPika", email = "hi@kdpika.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
secure-storage = ["keyring>=25,<27"]
ui = ["PyQt6>=6.7,<7"]
keyring = ["keyring>=25,<27"]
qt = ["PyQt6>=6.7,<7"]
test = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "hypothesis>=6,<7", "Flask>=3.1,<4"]
dev = ["build>=1.3,<2", "twine>=6,<7", "ruff>=0.14,<0.15", "mypy>=1.18,<2", "pre-commit>=4,<5", "tox>=4,<5", "pip-audit>=2.9,<3", "packaging>=25,<27", "Flask>=3.1,<4", "pytest>=9.0.3,<10", "pytest-cov>=6,<7", "hypothesis>=6,<7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9,<10", "mkdocstrings[python]>=1.0.8,<2", "mkdocstrings-python>=2.0.9,<3", "pymdown-extensions>=12.3,<13"]

[project.urls]
Documentation = "https://licensing.kdpika.com/docs/v1/sdks/python"
Homepage = "https://licensing.kdpika.com"
Source = "https://github.com/kdpika/kdpika-licensing-python"
Issues = "https://github.com/kdpika/kdpika-licensing-python/issues"

[tool.setuptools.dynamic]
version = {attr = "kdpika_licensing._version.__version__"}

[tool.setuptools]
include-package-data = true
[tool.setuptools.package-data]
kdpika_licensing = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: explicitly opted-in live Sandbox integration (never default)"]
filterwarnings = ["default::DeprecationWarning"]

[tool.coverage.run]
source = ["kdpika_licensing"]
omit = ["*/ui.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["PyQt6.*"]
ignore_missing_imports = true
